# ============================================
# FairStay — Local Production Build
# Usage: docker compose up --build
# ============================================

services:
  fairstay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/fairstay.db
      - CORS_ORIGINS=*
    volumes:
      - fairstay-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  fairstay-data:
